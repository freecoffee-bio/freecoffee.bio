name: Update Main

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: update-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        shell: bash
        run: |
          set -euo pipefail

          # Keep instance-specific Cloudflare bindings and deployment settings.
          if [ -f wrangler.jsonc ]; then
            cp wrangler.jsonc "$RUNNER_TEMP/wrangler.current.jsonc"
          fi

          git fetch https://github.com/freecoffee-bio/freecoffee.bio.git main
          git reset --hard FETCH_HEAD
          upstream_sha="$(git rev-parse --short HEAD)"

          if [ -f "$RUNNER_TEMP/wrangler.current.jsonc" ]; then
            cp "$RUNNER_TEMP/wrangler.current.jsonc" wrangler.jsonc
          fi

          git config user.name "Main Updater"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "Main is already up to date."
          else
            git add -A
            git commit -m "Update Main to ${upstream_sha}"
          fi

          git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
